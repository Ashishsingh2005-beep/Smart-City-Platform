version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: smartcity_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.0-alpine
    container_name: smartcity_redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: smartcity_app
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - redis
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/smartcity
      # Configure Cloudinary if needed:
      # - CLOUDINARY_CLOUD_NAME=your_cloud_name
      # - CLOUDINARY_API_KEY=your_api_key
      # - CLOUDINARY_API_SECRET=your_api_secret

volumes:
  mongo_data:
